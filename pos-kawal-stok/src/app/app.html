<div class="min-h-screen bg-slate-50 flex font-sans text-slate-800">

  <aside class="w-72 bg-slate-900 flex-shrink-0 min-h-screen flex flex-col relative overflow-hidden">

    <div
      class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-indigo-500/20 to-transparent pointer-events-none">
    </div>

    <div class="p-8 flex items-center gap-4 relative z-10">
      <div
        class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-indigo-500/30">
        ST
      </div>
      <div>
        <h1 class="text-lg font-bold text-white tracking-wide">Pos Kawal Stok</h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mt-0.5">Distributor Hub</p>
      </div>
    </div>

    <nav class="flex-1 px-4 mt-4 space-y-1.5 relative z-10">
      <p class="px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 mt-8">Menu Utama</p>

      <a routerLink="/create-order" routerLinkActive="bg-white/10 text-white shadow-inner"
        [routerLinkActiveOptions]="{exact: true}"
        class="group flex items-center gap-3 px-4 py-3.5 text-sm font-medium rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-all duration-300">
        <svg class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
        Buat Pesanan
      </a>

      <a routerLink="/orders" routerLinkActive="bg-white/10 text-white shadow-inner"
        class="group flex items-center gap-3 px-4 py-3.5 text-sm font-medium rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-all duration-300">
        <svg class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
          </path>
        </svg>
        Daftar Pesanan
      </a>

      <a routerLink="/items" routerLinkActive="bg-white/10 text-white shadow-inner"
        class="group flex items-center gap-3 px-4 py-3.5 text-sm font-medium rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-all duration-300">
        <svg class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
        </svg>
        Pengecekan Stok
      </a>
    </nav>

    <div class="p-6 relative z-10">
      <div class="bg-white/5 border border-white/10 rounded-2xl p-4 text-center">
        <p class="text-xs text-slate-400 font-medium">Sistem berjalan dengan lancar.</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50">
    <header
      class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200/60 flex items-center px-10 shadow-[0_4px_20px_-15px_rgba(0,0,0,0.05)] shrink-0 z-40 sticky top-0">
      <div class="flex items-center gap-3 text-slate-800">
        <h2 class="font-bold text-xl tracking-tight">Dashboard Overview</h2>
      </div>
    </header>

    <div class="p-8 lg:p-10 overflow-y-auto flex-1 relative">
      <div
        class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-indigo-50/50 to-transparent pointer-events-none">
      </div>
      <div class="relative z-10 max-w-5xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>

</div>
